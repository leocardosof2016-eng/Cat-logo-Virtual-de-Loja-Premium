<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escobar Variedades</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            green: '#3eb521',
                            cyan: '#1a918b',
                            dark: '#1e293b',
                            light: '#e0dfde'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-brand-light text-brand-dark antialiased font-sans relative pb-24">

    <!-- Header -->
    <header class="relative bg-white shadow-sm">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Background" class="w-full h-full object-cover opacity-20">
            <div class="absolute inset-0 bg-gradient-to-b from-white/30 to-white"></div>
        </div>
        
        <div class="relative z-10 px-4 pt-12 pb-6 flex flex-col items-center text-center">
            <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 mb-2">Escobar Variedades</h1>
            <div class="inline-flex items-center bg-green-300/20 text-brand-green px-3 py-1 rounded-full text-sm font-semibold border border-brand-green/20">
                <i class="fa-solid fa-star text-xs mr-2 animate-pulse-fast"></i>
                Variedade e qualidade no mesmo lugar!
            </div>
            
            <button id="open-search" class="mt-6 w-full max-w-md bg-white border-2 border-gray-300 shadow-sm rounded-xl px-4 py-3 flex items-center text-gray-400 hover:border-brand-green transition-colors">
                <i class="fa-solid fa-search mr-3"></i>
                <span>Buscar produtos...</span>
            </button>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm bg-gradient-to-b from-white to-stone-300">
        <div class="flex overflow-x-auto no-scrollbar gap-2 px-4 py-3" id="category-nav">
            <!-- Categories will be injected via JS -->
        </div>
    </nav>

    <!-- Main Content (Products) -->
    <main class="max-w-7xl mx-auto px-4 py-6" id="products-container">
        <!-- Products will be injected via JS -->
    </main>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-white hidden flex-col">
        <div class="p-4 border-b border-gray-100 flex items-center gap-3">
            <button id="close-search" class="p-2 text-gray-500 hover:text-gray-900"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <input type="text" id="search-input" class="w-full text-lg outline-none bg-transparent" placeholder="O que você procura?" autofocus>
        </div>
        <div class="flex-1 overflow-y-auto p-4" id="search-results">
            <!-- Search results injected here -->
        </div>
    </div>

    <!-- Product Modal (Vitrine) -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/50 hidden flex-col justify-end backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-h-[90vh] rounded-t-3xl flex flex-col slide-up relative">
            <button id="close-product" class="absolute top-4 right-4 w-8 h-8 bg-white/80 backdrop-blur rounded-full flex items-center justify-center text-gray-800 shadow-sm z-10">
                <i class="fa-solid fa-times"></i>
            </button>
            <div class="overflow-y-auto pb-24"> 
                <!-- Área da imagem com Carrossel -->
                <div class="relative w-full h-64 bg-gray-100 flex-shrink-0">
                    <img id="modal-img" src="" alt="Produto" class="w-full h-full object-cover transition-all duration-300 no-scrollbar">
                    
                    <!-- Botões do Carrossel -->
                    <button id="btn-prev-img" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center text-gray-800 shadow-md hidden hover:bg-white transition-colors z-10">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button id="btn-next-img" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center text-gray-800 shadow-md hidden hover:bg-white transition-colors z-10">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    
                    <!-- Indicador de página -->
                    <div id="image-counter" class="absolute bottom-3 right-3 bg-black/50 text-white text-xs font-bold px-2 py-1 rounded-full backdrop-blur hidden">
                        1/1
                    </div>
                </div>
            </div>
                <div class="p-5 border-t-2 border-brand-light">
                    <h2 id="modal-title" class="text-2xl font-bold mb-1"></h2>
                    <p id="modal-desc" class="text-gray-500 text-sm mb-4 leading-relaxed"></p>
                    <div class="text-2xl font-extrabold text-brand-cyan mb-6" id="modal-price"></div>

                    <!-- Extras (Upsell) -->
                    <div id="modal-extras-container" class="mb-6 hidden">
                        <h3 class="font-semibold text-gray-900 mb-3 text-sm uppercase tracking-wider">Adicionais</h3>
                        <div id="modal-extras" class="space-y-2"></div>
                    </div>

                    <!-- Observations -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2" for="modal-obs">Alguma observação?</label>
                        <textarea id="modal-obs" class="w-full border-2 border-gray-300 rounded-xl p-3 text-sm focus:border-brand-green focus:ring-1 focus:ring-brand-green outline-none" rows="2" style="resize:none;"></textarea>
                    </div>

                    <!-- Quantity & Add to Cart -->
                    <div class="flex items-center gap-4 mt-6">
                        <div class="flex items-center bg-gray-100 rounded-xl border-2 border-gray-300 overflow-hidden">
                            <button id="btn-minus" class="w-10 h-12 flex items-center justify-center text-gray-600 hover:bg-gray-200 font-bold">-</button>
                            <span id="modal-qty" class="w-10 text-center font-bold">1</span>
                            <button id="btn-plus" class="w-10 h-12 flex items-center justify-center text-gray-600 hover:bg-gray-200 font-bold">+</button>
                        </div>
                        <button id="btn-add-cart" class="flex-1 bg-brand-green text-white font-bold rounded-xl h-12 shadow-lg shadow-brand-green/30 hover:bg-green-600 transition-colors">
                            Adicionar - <span id="modal-total-btn">R$ 0,00</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-4px_15px_rgba(0,0,0,0.05)] p-4 px-6 z-40 hidden flex items-center justify-between slide-up">
        <div>
            <p class="text-xs text-gray-500 font-semibold uppercase">Minha Sacola</p>
            <p class="font-bold text-lg" id="cart-bar-total">R$ 0,00</p>
            <p class="font-bold text-lg inline" id="cart-bar-qty">0
                <p class="font-bold text-lg inline" id="cart-bar-text"> itens</p>
            </p>
        </div>
        <button id="open-checkout" class="bg-brand-cyan text-white px-6 py-2.5 rounded-full font-bold shadow-md shadow-brand-cyan/20 hover:bg-teal-600 transition-colors">
            Ver Sacola
        </button>
    </div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/5573999644285" target="_blank" id="whatsapp-btn" class="fixed bottom-6 right-6 w-14 h-14 bg-[#25D366] text-white rounded-full flex items-center justify-center text-2xl shadow-xl z-30 transition-all duration-300 hover:scale-110">
        <i class="fa-brands fa-whatsapp animate-pulse-slow"></i>
    </a>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 z-50 bg-white hidden flex-col">
        <div class="p-4 border-b border-gray-100 flex items-center gap-3 shadow-sm bg-white sticky top-0 z-10">
            <button id="close-checkout" class="p-2 text-gray-500 hover:text-gray-900"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <h2 class="text-xl font-bold">Finalizar Pedido</h2>
        </div>
        <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
            <!-- Items list -->
            <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-gray-100">
                <h3 class="font-bold mb-4 text-gray-800 border-b pb-2">Seus Itens</h3>
                <div id="checkout-items" class="space-y-4"></div>
            </div>

            <!-- Form -->
            <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-gray-100 space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700" for="checkout-name">Nome Completo</label>
                    <input type="text" id="checkout-name" class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:border-brand-green outline-none" placeholder="Digite seu nome">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-700" for="checkout-payment">Forma de Pagamento</label>
                    <select id="checkout-payment" class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:border-brand-green outline-none bg-white">
                        <option value="Pix">Pix (Recomendado)</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                        <option value="Cartão de Débito">Cartão de Débito</option>
                    </select>
                </div>
            </div>

            <!-- Summary -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between mb-2 text-sm text-gray-500">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">R$ 0,00</span>
                </div>
                <div class="flex justify-between mb-4 text-sm text-green-500">
                    <span>Desconto</span>
                    <span>- R$ 0,00</span>
                </div>
                <div class="flex justify-between font-bold text-lg border-t pt-3">
                    <span>Total</span>
                    <span id="checkout-total">R$ 0,00</span>
                </div>
            </div>
        </div>
        <div class="p-4 bg-white border-t shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
            <button id="btn-send-whatsapp" class="w-full bg-[#25D366] text-white font-bold rounded-xl h-14 shadow-lg hover:bg-green-600 transition-colors flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                Finalizar no WhatsApp
            </button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
